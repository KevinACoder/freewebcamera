# full - the trunk image: all three wireless lines + camera + microphone.
#
# Equivalent to the pre-config `make WLAN_NIC=all UVC=1 UAC=1`, which was
# the default image.  Composed from fragments/ so a config is a list of
# capabilities rather than a copy of the key table.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := full
include $(CONFIG_DIR)/fragments/nic-iwm.conf
include $(CONFIG_DIR)/fragments/nic-urtwn.conf
include $(CONFIG_DIR)/fragments/nic-rtw8189f.conf
include $(CONFIG_DIR)/fragments/uvc.conf
include $(CONFIG_DIR)/fragments/uac.conf
