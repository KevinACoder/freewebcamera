# cherryusb-urtwn - the CherryUSB wlan line: the comparison stack carrying the
# verbatim NetBSD urtwn driver through the usbdi(9) request compat layer.
#
# This is the image the D-C3 acceptance ladder runs on (enumeration -> scan ->
# connect -> DHCP -> iperf3 600 s), the same ladder the netbsd backend's
# `urtwn` configuration is measured on.  The camera and the microphone are
# not in it: upstream CherryUSB has no isochronous support and the Makefile
# rejects the combination outright.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := cherryusb-urtwn

include $(CONFIG_DIR)/fragments/nic-urtwn.conf
include $(CONFIG_DIR)/fragments/usb-stack-cherryusb.conf
