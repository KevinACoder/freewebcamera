# cherryusb-xhci-enum - the feat/cherryusb_xhci enumeration checkpoint: the
# CherryUSB host stack up on the two panel EHCI roots AND the USB3 socket
# group's xHCI root, no wireless driver behind it.
#
# `usbh start` brings all three buses up; the acceptance anchor is the xHCI
# bus (busid 3) enumerating the GenesysLogic hub and the RTL8188EU behind it
# (`usbh list -t`, `usbh xdump`), with the two EHCI roots unchanged as the
# zero-regression witness.  net80211/lwIP/wpa arrive with the
# cherryusb-urtwn-xhci config once enumeration holds.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := cherryusb-xhci-enum

# The bus without a wireless line: the only image in the tree that wants USB
# and nothing on it.
CONFIG_BUS_USB := 1

include $(CONFIG_DIR)/fragments/usb-stack-cherryusb-xhci.conf
