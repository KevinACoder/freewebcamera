# min - kernel + shell only: no network world, no USB, no camera.
#
# This is base.conf verbatim (every feature key at its default of 0).  It
# exists to prove the trim: a configuration that compiles the whole network
# world, all three wireless lines and the A/V lines out of the image and
# still links and boots.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := min
