# cherryusb-urtwn-xhci - the feat/cherryusb_xhci wlan line: the comparison
# stack carrying the verbatim NetBSD urtwn driver over the xHCI link (the
# dongle on the USB3 socket group behind its GenesysLogic hub) through the
# usbdi(9) request compat layer.
#
# This is the image the D-C3 acceptance ladder runs on (enumeration -> scan
# -> connect -> DHCP -> iperf3 600 s), the same ladder the netbsd backend's
# xHCI run measured at 10.39/9.20 Mbit/s.  The two panel EHCI roots stay in
# the image as the zero-regression witness; the camera and the microphone
# are not in it (no isochronous support upstream).
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := cherryusb-urtwn-xhci

include $(CONFIG_DIR)/fragments/nic-urtwn.conf
include $(CONFIG_DIR)/fragments/usb-stack-cherryusb-xhci.conf
