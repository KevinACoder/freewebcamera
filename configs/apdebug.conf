# apdebug - the wireless closed-loop bench: the board's own AP + station.
#
# rtw8189f (SDIO, onboard) runs HOSTAP - `wlan ap start freewc 11` after
# `net set rtw8189f 192.168.77.1 255.255.255.0`; urtwn (RTL8188EUS, USB)
# joins it as the station - `wlan nic urtwn` + `wpa connect freewc`.
# The loop bench rides `loop recv/send` bound to the slot addresses.
#
# USB backend: CherryUSB + the xHCI root - the dongle sits behind its
# GenesysLogic hub on the USB3 socket group (0xFCC00000), the combo the
# cherryusb_xhci ladder proved (the netbsd stack's xhci control endpoint
# wedges on that topology - feat/xhci territory, not this line's).
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := apdebug
include $(CONFIG_DIR)/fragments/nic-rtw8189f.conf
include $(CONFIG_DIR)/fragments/nic-urtwn.conf
include $(CONFIG_DIR)/fragments/usb-stack-cherryusb-xhci.conf
