# iwm-uvc - PCIe wireless + camera: the throughput-headroom image.
#
# The UVC line's own notes ask for "an iwm+USB image": the camera streams
# over the isolated EHCI group while the network leaves through PCIe, so
# the capture path is not competing with the SDIO rtw8189f for the same
# bus.  This is the combination that motivated splitting the bus keys from
# the line keys - UVC selects USB even though no USB wireless line is built.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := iwm-uvc
include $(CONFIG_DIR)/fragments/nic-iwm.conf
include $(CONFIG_DIR)/fragments/uvc.conf
include $(CONFIG_DIR)/fragments/uac.conf
