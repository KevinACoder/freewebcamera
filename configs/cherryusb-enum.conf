# cherryusb-enum - the CherryUSB EHCI bring-up image: the USB host stack up
# on both panel EHCI roots with no wireless driver behind it.
#
# This is the enumeration checkpoint of feat/cherryusb_ehci: `usbh start`
# brings the domain and both controllers up, the hub threads enumerate what is
# plugged into the panel sockets (the RTL8188EUS behind the CH334P shows as an
# unclaimed device), and `usbreq list|info|desc|ctrl` drives the abstraction
# from the console.  No net80211, no lwIP, no wpa: those arrive with the
# cherryusb-urtwn config once the usbdi compat layer lands.
include $(CONFIG_DIR)/base.conf

CONFIG_NAME := cherryusb-enum

# The bus without a wireless line: the only image in the tree that wants USB
# and nothing on it.
CONFIG_BUS_USB := 1

include $(CONFIG_DIR)/fragments/usb-stack-cherryusb.conf
