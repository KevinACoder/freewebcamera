# CherryUSB host stack with the xHCI root (feat/cherryusb_xhci).  Everything
# usb-stack-cherryusb.conf says holds; this adds the USB3 socket group's
# upper-port xHCI root (0xFCC00000, where the rtl8188eu sits behind its
# GenesysLogic hub) as the third bus of the image.
CONFIG_USB_BACKEND := cherryusb
CONFIG_USBHOST_XHCI := 1

include $(CONFIG_DIR)/fragments/usb-stack-cherryusb.conf
