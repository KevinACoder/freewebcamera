# CherryUSB host stack (feat/cherryusb_ehci).  Selects the comparison line's
# USB backend in place of the imported NetBSD usbdi world.  The two are
# compile-time alternatives: one backend per image (D-C1③).
#
# The camera/microphone lines are exclusive with this backend - upstream
# CherryUSB has no isochronous support, and the Makefile rejects the
# combination rather than linking a driver against a stack that cannot carry it.
CONFIG_USB_BACKEND := cherryusb
