# Microphone line: audio(4) + uaudio + the av_audio consumer.
#
# Also selects UVC: the audio shell commands and the raw-stream dump channel
# are in the UVC block today (see base.conf).  Doing it here keeps the
# coupling visible in the fragment rather than hidden in a Makefile rule, and
# keeps a config that includes this file self-consistent.
CONFIG_UAC := 1
CONFIG_UVC := 1
