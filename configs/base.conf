# base.conf - the configuration key table (single source of truth).
#
# Included by every configs/<name>.conf, so this file carries the defaults
# and the documentation for every key the build understands.  The defaults
# describe the *minimal* image: kernel + shell, no network stack, no USB,
# no camera.  configs/min.conf is exactly this file; the other configs add
# fragments/ on top.
#
# Semantics
# ---------
#  - Keys are make variables named CONFIG_*; the same names become the
#    macros in the generated <build>/config.h (bool keys become 1/0).
#  - A config file may override any key AFTER including this file.
#  - `make CONFIG_<KEY>=<value>` on the command line wins over both (make
#    gives command-line variables precedence over ordinary assignments).
#  - Legacy aliases keep the pre-config commands working: WLAN_NIC=, UVC=,
#    UAC=, UVC_DEBUG=, UC_OPT=.  They are translated into keys before the
#    implications below run.  See the "legacy aliases" block in the Makefile.
#  - CONFIG_BUS_* are derived from the lines that need them (a line selects
#    its bus); setting one to 1 by hand adds a bus without adding a line.
#  - Switching a config selects a different build directory, so no `make
#    clean` is needed between configs; changing a key *within* a config is
#    caught by the stamp and demands a clean, because the -D defines are
#    invisible to the dependency files.

# --- build / platform ------------------------------------------------------

# Image identity: names the build directory, rides the banner, and is the
# value printed by `make show-config`.  Normally the CONFIG= name.
# CONFIG_NAME is set by the Makefile from CONFIG= unless a config overrides.

# Board directory under port/board/ (board_conf.h + link script).
CONFIG_BOARD ?= rk3568

# Cores the image brings up.  Only 1 is supported on this trunk: the second-
# aries park in the UP image and the SMP line is a separate feat branch, so
# any other value is rejected with a pointer to it rather than silently
# building a half-SMP image.
CONFIG_SMP_CORES ?= 1

# Optimization profile.  Default is the gdb carrier (-Og -g3): symbols plus
# near-no optimization, so breakpoint addresses land on code the debugger
# can stop at.  CONFIG_OPT=-O0 reproduces the reference SDK's exact-noopt
# shape (D57).
CONFIG_OPT ?= -Og

# --- feature blocks --------------------------------------------------------

# Console shell (cherrysh + cherryrb and every command TU registered through
# the FSymTab section).  0 leaves a kernel with a silent console - useful
# only to prove the trim links.
CONFIG_SHELL ?= 1

# The network world as one block: net80211 (libbsd), the BSD port core, lwIP,
# wpa_supplicant and netutils, plus every wireless line below.  Splitting it
# further (lwIP alone, wpa alone) needs the lwip<->wlan bridge and the
# wpa<->net80211 couplings untangled first - a later line.
CONFIG_NET ?= 0

# Camera line: NetBSD uvideo (USB video class) behind the video(4) middle
# layer, the av_video consumer and its shell commands.  Implies USB + NET.
CONFIG_UVC ?= 0

# Microphone line: audio(4) + uaudio + the av_audio consumer.  Implies
# UVC as well, because the audio shell commands and the raw-stream dump
# channel both live in the UVC block today (splitting uvc_cmds.c into a
# video and an audio command TU is a registered follow-up).
CONFIG_UAC ?= 0

# --- buses (derived) -------------------------------------------------------

# USB host stack (EHCI + xHCI + usbdi/hub): selected by the urtwn line and
# by UVC/UAC.
CONFIG_BUS_USB ?= 0

# DW PCIe host + MSI-X (the iwm line's bus).
CONFIG_BUS_PCIE ?= 0

# DW-MMC/SDIO host + the fsl_sdmmc stack (the rtw8189f line's bus).
CONFIG_BUS_SDIO ?= 0

# --- wireless lines --------------------------------------------------------

# Which wireless stacks the image carries at all.  A line that is off
# contributes no code, no threads and no buffers, so a driver being
# debugged is never coupled to the others - neither through the shared
# heap (iwm's RX ring alone is ~1.1 MB) nor through the bus bring-up order.
CONFIG_NIC_IWM ?= 0		# PCIe: DW host + iwm + iwlwifi ucode
CONFIG_NIC_URTWN ?= 0		# USB: netbsd usb di/hcd + urtwn + rtl fw
CONFIG_NIC_RTW8189F ?= 0	# SDIO: dw-mmc host + fsl_sdmmc + rtw8189f

# --- diagnostics -----------------------------------------------------------

# DIAGNOSTIC keeps upstream's KASSERT family (and the xfer state it inspects)
# live, plus the DIAGNOSTIC-only prints (uhub port failures, ehci xfer dumps).
CONFIG_BSD_DIAGNOSTIC ?= 1

# IWM_DEBUG compiles in iwm_nic_error()/the tx/rx-ring dump that runs on the
# fatal-firmware-error interrupt; without it the SW_ERR branch prints a
# single line and the error id is unrecoverable.
CONFIG_IWM_DEBUG ?= 1

# USB/EHCI/xHCI history-log defaults (the runtime `usbdebug`/`ehcidebug`/
# `xhcidebug` shell commands still override them).  0 silences the logs.
CONFIG_USB_DEBUG_DEFAULT ?= 10
CONFIG_EHCI_DEBUG_DEFAULT ?= 10
CONFIG_XHCI_DEBUG_DEFAULT ?= 10

# usb.c's history ring depth.  Upstream's 50000 records would be ~3 MB of
# .bss here; 4096 x 64 B keeps a whole enumeration trail with room to spare.
CONFIG_USBHIST_SIZE ?= 4096

# The imported UVC driver's own forensics (UVIDEO_DEBUG payload counters,
# the first-8-packet header dump, EHCI's isoc iTD dump).  Bring-up only.
CONFIG_UVC_DEBUG ?= 0

# --- memory ----------------------------------------------------------------

# System heap: a TLSF arena at a fixed physical base, not a .bss array -
# 100 MB of .bss would swallow the fixed-address regions the port keeps
# (USB DMA pool, wlan mbuf pools, iwm RX ring).  The MMU maps
# [0x0a000000, 0xc0000000) Normal cacheable, so any base in that window is
# ordinary cacheable RAM.  heap_ram_probe() proves it at boot.
CONFIG_HEAP_BASE ?= 0x20000000
CONFIG_HEAP_BYTES ?= 104857600

# --- thread stacks ---------------------------------------------------------
# Sizes in bytes.  The values in use are the ones the bring-up rounds
# converged on; see the comments at each site for what overflowed first.

# ThreadX kernel timer thread.  4 KB overflowed the net80211 callout chains
# (driver watchdog / state machines run there through the CMSIS timer bridge).
CONFIG_TX_TIMER_STACK ?= 16384

# lwIP tcpip thread: the whole stack plus the socket layer runs on it.
CONFIG_LWIP_THREAD_STACK ?= 8192

# wlan worker (net80211 callout bodies, RX/tx processing).
CONFIG_WLAN_WORKER_STACK ?= 8192

# wpa_supplicant main task (deep crypto/scan call chains).
CONFIG_WPA_THREAD_STACK ?= 65536

# cherrysh task.
CONFIG_SHELL_STACK ?= 4096

# Boot anchor tasks (shell bring-up + net bring-up) in app/main.c.
CONFIG_APP_START_STACK ?= 2048

# --- lwIP tuning -----------------------------------------------------------

# lwIP's own heap (PBUF_RAM staging etc.).
CONFIG_LWIP_MEM_SIZE ?= 131072
CONFIG_LWIP_PBUF_POOL_SIZE ?= 40
CONFIG_LWIP_PBUF_BUFSIZE ?= 1600

# --- camera ----------------------------------------------------------------

# Raw-stream dump ring per channel (video/audio), a static .bss array.
CONFIG_AV_DUMP_RING_BYTES ?= 524288

# --- internal --------------------------------------------------------------

# Proves the config chain reached base.conf; the Makefile refuses a config
# file that forgets to include it.
CONFIG_BASE_LOADED := 1
